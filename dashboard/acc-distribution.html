<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
        }

        .viz-wrapper {
            background: white;
            border-radius: 16px;
            padding: 24px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #718096;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .insights {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .insight-title {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .insight-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #4a5568;
        }

        .insight-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .debug-section {
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            display: none;
        }

        .debug-section.show {
            display: block;
        }

        .debug-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="viz-wrapper">
        <h3 style="margin: 0 0 20px 0; color: #2d3748;">📊 Accuracy Distribution Analysis</h3>
        
        <div class="controls" id="controls">
            <button class="filter-btn active" data-filter="all">All Difficulties</button>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="chart-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div style="color: #718096;">Loading data...</div>
            </div>
            <canvas id="histChart"></canvas>
        </div>

        <div class="insights" id="insights"></div>

        <div class="debug-section" id="debugSection"></div>
    </div>

    <script>
        const diffColors = {
            'Easy': '#48bb78',
            'Normal': '#38b2ac',
            'Hard': '#ff8c42',
            'Expert': '#9f7aea',
            'ExpertPlus': '#f56565'
        };

        const diffOrder = ['Easy', 'Normal', 'Hard', 'Expert', 'ExpertPlus'];

        let allData = [];
        let currentFilter = 'all';
        let chart = null;

        async function loadData() {
            try {
                console.log('Fetching data...');
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.beatleader.com/player/76561198274713084/accgraph?leaderboardContext=general&type=acc&no_unranked_stars=true'));
                const data = await response.json();
                
                console.log(`Loaded ${data.length} scores`);
                
                allData = data.map(score => ({
                    acc: score.acc * 100,
                    diff: score.diff,
                    songName: score.songName,
                    stars: score.stars,
                    pp: score.pp,
                    mapper: score.mapper
                }));

                document.getElementById('loading').style.display = 'none';
                setupControls();
                updateVisualization();
                showDebugInfo();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = `<div style="color: #e53e3e;">Error: ${error.message}</div>`;
            }
        }

        function setupControls() {
            const diffs = [...new Set(allData.map(d => d.diff))].sort((a, b) => 
                diffOrder.indexOf(a) - diffOrder.indexOf(b)
            );
            
            const controls = document.getElementById('controls');
            diffs.forEach(diff => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.setAttribute('data-filter', diff);
                btn.textContent = diff === 'ExpertPlus' ? 'Expert+' : diff;
                btn.onclick = () => setFilter(diff);
                controls.appendChild(btn);
            });

            const debugBtn = document.createElement('button');
            debugBtn.className = 'filter-btn';
            debugBtn.textContent = '🐛 Debug';
            debugBtn.onclick = () => {
                document.getElementById('debugSection').classList.toggle('show');
            };
            controls.appendChild(debugBtn);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
            });
            updateVisualization();
        }

        function updateVisualization() {
            const filtered = currentFilter === 'all' 
                ? allData 
                : allData.filter(d => d.diff === currentFilter);

            updateStats(filtered);
            createHistogram(filtered);
            generateInsights(filtered);
        }

        function updateStats(data) {
            const stats = calculateStats(data);
            
            const html = `
                <div class="stat-card">
                    <div class="stat-value">${data.length}</div>
                    <div class="stat-label">Total Plays</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.mean.toFixed(2)}%</div>
                    <div class="stat-label">Mean</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.median.toFixed(2)}%</div>
                    <div class="stat-label">Median</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.mode.toFixed(1)}%</div>
                    <div class="stat-label">Mode</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.stdDev.toFixed(2)}%</div>
                    <div class="stat-label">Std Dev</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.min.toFixed(1)}%</div>
                    <div class="stat-label">Min</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.max.toFixed(1)}%</div>
                    <div class="stat-label">Max</div>
                </div>
            `;
            
            document.getElementById('statsGrid').innerHTML = html;
        }

        function calculateStats(data) {
            const values = data.map(d => d.acc).sort((a, b) => a - b);
            
            if (values.length === 0) {
                return { mean: 0, median: 0, mode: 0, stdDev: 0, min: 0, max: 0, q1: 0, q3: 0 };
            }

            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const median = values[Math.floor(values.length / 2)];
            
            // Calculate mode (most common accuracy range)
            const bins = {};
            values.forEach(v => {
                const bin = Math.floor(v);
                bins[bin] = (bins[bin] || 0) + 1;
            });
            const mode = parseFloat(Object.keys(bins).reduce((a, b) => bins[a] > bins[b] ? a : b));
            
            // Standard deviation
            const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / values.length;
            const stdDev = Math.sqrt(variance);
            
            const q1 = values[Math.floor(values.length * 0.25)];
            const q3 = values[Math.floor(values.length * 0.75)];

            return {
                mean,
                median,
                mode,
                stdDev,
                min: values[0],
                max: values[values.length - 1],
                q1,
                q3
            };
        }

        function createHistogram(data) {
            const ctx = document.getElementById('histChart').getContext('2d');
            
            // Create bins
            const binSize = 2; // 2% bins
            const bins = {};
            for (let i = 60; i <= 100; i += binSize) {
                bins[i] = 0;
            }
            
            // Fill bins
            data.forEach(d => {
                const bin = Math.floor(d.acc / binSize) * binSize;
                if (bins[bin] !== undefined) bins[bin]++;
            });

            const labels = Object.keys(bins);
            const counts = Object.values(bins);
            const colors = labels.map(label => {
                const acc = parseFloat(label) / 100;
                if (acc < 0.80) return '#48bb78';
                if (acc < 0.85) return '#38b2ac';
                if (acc < 0.90) return '#4299e1';
                if (acc < 0.95) return '#9f7aea';
                return '#f56565';
            });

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(l => l + '-' + (parseFloat(l) + binSize) + '%'),
                    datasets: [{
                        label: 'Number of Plays',
                        data: counts,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c),
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (items) => `Accuracy: ${items[0].label}`,
                                label: (context) => `Plays: ${context.parsed.y}`,
                                afterLabel: (context) => {
                                    const percentage = ((context.parsed.y / data.length) * 100).toFixed(1);
                                    return `${percentage}% of total plays`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Accuracy Range',
                                font: { size: 14, weight: 'bold' }
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                font: { size: 10 }
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Plays',
                                font: { size: 14, weight: 'bold' }
                            },
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        function generateInsights(data) {
            const stats = calculateStats(data);
            const above95 = data.filter(d => d.acc >= 95).length;
            const above90 = data.filter(d => d.acc >= 90).length;
            const below80 = data.filter(d => d.acc < 80).length;
            
            const consistency = stats.stdDev < 5 ? 'Very Consistent' : 
                               stats.stdDev < 8 ? 'Consistent' : 'Variable';
            
            const skillLevel = stats.median >= 95 ? 'Elite' :
                              stats.median >= 90 ? 'Expert' :
                              stats.median >= 85 ? 'Advanced' :
                              stats.median >= 80 ? 'Intermediate' : 'Developing';

            const html = `
                <div class="insight-title">📈 Performance Insights</div>
                <div class="insight-item">
                    <div class="insight-icon" style="background: #667eea; color: white;">📊</div>
                    <div><strong>Skill Level:</strong> ${skillLevel} (median: ${stats.median.toFixed(1)}%)</div>
                </div>
                <div class="insight-item">
                    <div class="insight-icon" style="background: #48bb78; color: white;">🎯</div>
                    <div><strong>Consistency:</strong> ${consistency} (σ = ${stats.stdDev.toFixed(2)}%)</div>
                </div>
                <div class="insight-item">
                    <div class="insight-icon" style="background: #f56565; color: white;">⭐</div>
                    <div><strong>High Performance:</strong> ${above95} plays above 95% (${((above95/data.length)*100).toFixed(1)}%)</div>
                </div>
                <div class="insight-item">
                    <div class="insight-icon" style="background: #9f7aea; color: white;">📈</div>
                    <div><strong>Strong Performance:</strong> ${above90} plays above 90% (${((above90/data.length)*100).toFixed(1)}%)</div>
                </div>
                ${below80 > 0 ? `
                <div class="insight-item">
                    <div class="insight-icon" style="background: #ed8936; color: white;">⚠️</div>
                    <div><strong>Challenges:</strong> ${below80} plays below 80% - room for improvement</div>
                </div>
                ` : ''}
                <div class="insight-item">
                    <div class="insight-icon" style="background: #38b2ac; color: white;">📏</div>
                    <div><strong>Range:</strong> ${stats.min.toFixed(1)}% to ${stats.max.toFixed(1)}% (spread: ${(stats.max - stats.min).toFixed(1)}%)</div>
                </div>
            `;
            
            document.getElementById('insights').innerHTML = html;
        }

        function showDebugInfo() {
            const byDiff = {};
            diffOrder.forEach(diff => {
                const filtered = allData.filter(d => d.diff === diff);
                const stats = calculateStats(filtered);
                byDiff[diff] = {
                    count: filtered.length,
                    mean: stats.mean.toFixed(2),
                    median: stats.median.toFixed(2),
                    min: stats.min.toFixed(2),
                    max: stats.max.toFixed(2)
                };
            });

            let html = '<div style="font-weight: bold; margin-bottom: 12px;">Debug Information</div>';
            Object.entries(byDiff).forEach(([diff, stats]) => {
                html += `
                    <div class="debug-row">
                        <strong>${diff}:</strong>
                        <span>${stats.count} plays | Mean: ${stats.mean}% | Median: ${stats.median}% | Range: ${stats.min}%-${stats.max}%</span>
                    </div>
                `;
            });

            document.getElementById('debugSection').innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
